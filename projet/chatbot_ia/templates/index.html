<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChatBot IA — Assistant Santé</title>
  <style>
    :root { --bg:#0f172a; --panel:#1e293b; --bot:#334155; --user:#2563eb;
            --text:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
           background: var(--bg); color: var(--text); height:100vh; display:flex;
           flex-direction:column; align-items:center; }
    header { padding:16px; text-align:center; }
    header h1 { margin:0; font-size:1.25rem; }
    header p { margin:4px 0 0; color: var(--muted); font-size:.85rem; }
    #chat { flex:1; width:100%; max-width:720px; overflow-y:auto; padding:16px;
            display:flex; flex-direction:column; gap:12px; }
    .msg { max-width:80%; padding:10px 14px; border-radius:14px; line-height:1.4;
           white-space:pre-wrap; }
    .msg.user { align-self:flex-end; background: var(--user); color:#fff;
                border-bottom-right-radius:4px; }
    .msg.bot { align-self:flex-start; background: var(--bot);
               border-bottom-left-radius:4px; }
    .fb { margin-top:6px; display:flex; gap:4px; }
    .fb button { background:transparent; border:1px solid var(--muted); color:var(--muted);
                 border-radius:8px; width:28px; height:28px; cursor:pointer; font-size:.8rem; }
    .fb button:hover { border-color: var(--accent); color: var(--accent); }
    .fb .done { color: var(--accent); font-size:.8rem; align-self:center; }
    form { width:100%; max-width:720px; display:flex; gap:8px; padding:16px; }
    #q { flex:1; padding:12px 14px; border-radius:12px; border:1px solid var(--panel);
         background: var(--panel); color: var(--text); font-size:1rem; }
    #q:focus { outline:2px solid var(--accent); }
    button.send { padding:0 20px; border:none; border-radius:12px; background: var(--accent);
                  color:#04222f; font-weight:600; cursor:pointer; }
  </style>
</head>
<body>
  <header>
    <h1>🩺 ChatBot IA — Assistant Santé</h1>
    <p>Posez une question sur les maladies, symptômes, causes, traitements ou la prévention.</p>
  </header>

  <div id="chat"></div>

  <form id="form" autocomplete="off">
    <input id="q" type="text" placeholder="Ex : Quels sont les symptômes du diabète ?" required>
    <button class="send" type="submit">Envoyer</button>
  </form>

  <script>
    const chat = document.getElementById('chat');
    const form = document.getElementById('form');
    const input = document.getElementById('q');

    function addMessage(text, who) {
      const div = document.createElement('div');
      div.className = 'msg ' + who;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    function addFeedback(botDiv, question, answer) {
      const fb = document.createElement('div');
      fb.className = 'fb';
      for (let i = 1; i <= 5; i++) {
        const b = document.createElement('button');
        b.textContent = i;
        b.onclick = () => sendFeedback(question, answer, i, fb);
        fb.appendChild(b);
      }
      botDiv.appendChild(fb);
    }

    async function sendFeedback(question, answer, score, fb) {
      try {
        await fetch('/feedback', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question, answer, score })
        });
      } catch (e) { /* silencieux */ }
      fb.innerHTML = '<span class="done">Merci pour votre retour ✓</span>';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const question = input.value.trim();
      if (!question) return;
      addMessage(question, 'user');
      input.value = '';
      let answer = '…';
      try {
        const res = await fetch('/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question })
        });
        const data = await res.json();
        answer = data.answer || data.error || 'Erreur.';
      } catch (e) {
        answer = 'Erreur de connexion au serveur.';
      }
      const botDiv = addMessage(answer, 'bot');
      addFeedback(botDiv, question, answer);
    });
  </script>
</body>
</html>
